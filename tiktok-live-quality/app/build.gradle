plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zaid.tiktoklivequality'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zaid.tiktoklivequality'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
