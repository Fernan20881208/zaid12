name: Build Zaid Screen Recorder

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaid-screen-recorder/**'
      - '.github/workflows/build-zaid-screen-recorder.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: zaid-screen-recorder
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp zaid-screen-recorder/app/build/outputs/apk/debug/app-debug.apk out/Zaid-Screen-Recorder-v1.0.0.apk
          sha256sum out/Zaid-Screen-Recorder-v1.0.0.apk | tee out/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Screen-Recorder-v1.0.0
          path: out/
          if-no-files-found: error
          retention-days: 30
