name: Build Zaid Screen Recorder

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaid-screen-recorder/**'
      - '.github/workflows/build-zaid-screen-recorder.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and capture log
        working-directory: zaid-screen-recorder
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../zaid-screen-recorder-build.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > ../zaid-screen-recorder-build.rc
          exit 0
      - name: Surface Gradle errors
        if: always()
        shell: bash
        run: |
          if [ "$(cat zaid-screen-recorder-build.rc 2>/dev/null || echo 1)" != "0" ]; then
            grep -Ei 'error:|cannot find symbol|FAILURE:|Execution failed|What went wrong|Could not resolve|AAPT:|Manifest merger failed|resource .* not found' zaid-screen-recorder-build.log | tail -40 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Gradle build error::$line"
            done
          fi
      - name: Prepare artifact when build succeeds
        if: always()
        run: |
          mkdir -p out
          if [ "$(cat zaid-screen-recorder-build.rc)" = "0" ]; then
            cp zaid-screen-recorder/app/build/outputs/apk/debug/app-debug.apk out/Zaid-Screen-Recorder-v1.2.0.apk
            sha256sum out/Zaid-Screen-Recorder-v1.2.0.apk | tee out/SHA256SUMS.txt
          fi
          cp zaid-screen-recorder-build.log out/BUILD-LOG.txt
          cp zaid-screen-recorder-build.rc out/BUILD-RC.txt
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Screen-Recorder-v1.2.0-build
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Fail if Gradle failed
        run: test "$(cat zaid-screen-recorder-build.rc)" = "0"
