name: Build Infinix X6891 Launcher

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "infinix-x6891-launcher/**"
      - ".github/workflows/build-infinix-launcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: infinix-x6891-launcher
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-X6891-Launcher-debug
          path: infinix-x6891-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
